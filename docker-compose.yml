# Dev-only compose. Credentials are non-secret and only reachable on 127.0.0.1.
# For production, use Docker secrets or an env file that's not committed.

services:
  postgres:
    image: postgres:16
    container_name: keyafe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: keyafe
      POSTGRES_PASSWORD: keyafeDevPass
      POSTGRES_DB: keyafe
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyafe -d keyafe"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  adminer:
    image: adminer:4
    container_name: keyafe-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha
    ports:
      - "127.0.0.1:8081:8080"

volumes:
  postgres_data:
