# Admin — HTTP first. Certbot will add HTTPS.
# sudo cp deploy/nginx/admin.keyafe.com.conf /etc/nginx/sites-available/admin.keyafe.com
# sudo ln -sf /etc/nginx/sites-available/admin.keyafe.com /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
# sudo certbot --nginx -d admin.keyafe.com

server {
    listen 80;
    listen [::]:80;
    server_name admin.keyafe.com;

    root /var/www/keyafe/current/admin;
    index index.html;

    client_max_body_size 15m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://keyafe_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /uploads/ {
        alias /var/www/keyafe/shared/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
